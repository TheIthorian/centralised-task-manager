packages:
  - 'apps/*'
  - 'packages/*'
overrides:
  fastify: $fastify

allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@scarf/scarf': false
  '@swc/core': true
  bcrypt: true
  core-js: true
  core-js-pure: true
  esbuild: true
  postman-code-generators: false
  sharp: true
  workerd: true
