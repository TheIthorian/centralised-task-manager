name: Affected packages
description: Lists the workspace packages a push touched, following the turbo dependency graph.

inputs:
    base:
        description: Commit to diff against. Anything undiffable falls back to "everything is affected".
        required: false
        default: ${{ github.event.before }}

outputs:
    packages:
        description: JSON array of affected package names, or ["*"] when everything should be treated as affected.
        value: ${{ steps.affected.outputs.packages }}

runs:
    using: composite
    steps:
        - uses: pnpm/action-setup@v4
        - uses: actions/setup-node@v4
          with:
              node-version-file: .nvmrc
              cache: pnpm
        # Only the root package, which is where turbo itself lives.
        - run: pnpm install --frozen-lockfile --prefer-offline --filter ctm
          shell: bash
        - id: affected
          shell: bash
          env:
              BASE: ${{ inputs.base }}
          run: |
              set -euo pipefail

              # No usable base — a manual run, a force-push, a first push — tells us
              # nothing about what changed, so treat everything as affected.
              if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
                  echo 'packages=["*"]' >> "$GITHUB_OUTPUT"
                  exit 0
              fi

              # Workflow files belong to no package, so turbo cannot see them.
              if git diff --name-only "$BASE" HEAD | grep -q '^\.github/'; then
                  echo 'packages=["*"]' >> "$GITHUB_OUTPUT"
                  exit 0
              fi

              packages=$(TURBO_SCM_BASE="$BASE" pnpm exec turbo ls --affected --output=json |
                  jq -c '[.packages.items[].name]')

              echo "affected: $packages"
              echo "packages=$packages" >> "$GITHUB_OUTPUT"
