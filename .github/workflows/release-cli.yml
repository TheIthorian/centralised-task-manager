name: release-cli

# Automatic triggers are off while the org's Actions storage quota is exhausted.
# Restore the push block below once there is headroom.
on:
    # push:
    #     branches: [main]
    #     paths:
    #         - 'apps/cli/**'
    #         - 'packages/api-client/**'
    #         - '.github/workflows/release-cli.yml'
    workflow_dispatch:

concurrency:
    group: release-cli-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    bundle:
        # The keyring is a native addon, so each artifact carries the binding for one
        # platform and has to be built on it.
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: macos-latest
                      target: darwin-arm64
                    - runner: macos-13
                      target: darwin-x64
                    - runner: ubuntu-latest
                      target: linux-x64
                    - runner: windows-latest
                      target: win32-x64
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile --prefer-offline

            - name: Package CLI
              env:
                  # Baked in as the last-resort API base URL. Unset produces a bundle that still
                  # requires --base-url or CTM_BASE_URL, so a missing variable is not silent.
                  CTM_DEFAULT_BASE_URL: ${{ vars.CTM_DEFAULT_BASE_URL }}
              run: pnpm exec turbo run package --filter=@ctm/cli

            - name: Archive
              shell: bash
              run: tar -czf ctm-cli-${{ matrix.target }}.tar.gz -C apps/cli/release .

            - name: Checksum
              shell: bash
              run: shasum -a 256 ctm-cli-${{ matrix.target }}.tar.gz > ctm-cli-${{ matrix.target }}.tar.gz.sha256

            - uses: actions/upload-artifact@v7
              with:
                  name: ctm-cli-${{ matrix.target }}
                  path: |
                      ctm-cli-${{ matrix.target }}.tar.gz
                      ctm-cli-${{ matrix.target }}.tar.gz.sha256
                  if-no-files-found: error
                  retention-days: 7

    release:
        needs: bundle
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        # Only this job writes; everything else keeps the read-only default token.
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v8
              with:
                  pattern: ctm-cli-*
                  merge-multiple: true
            - uses: softprops/action-gh-release@v3
              with:
                  files: |
                      ctm-cli-*.tar.gz
                      ctm-cli-*.tar.gz.sha256
