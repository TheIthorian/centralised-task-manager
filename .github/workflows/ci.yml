name: ci

on:
    pull_request:
    push:
        branches: [main]
    # Allows the deploy workflow to gate on a green build.
    workflow_call:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            # Restores turbo's local cache so unchanged packages skip their build.
            # Read-only here; only pushes to main write it, so a pull request can
            # never leave a cache entry behind for later runs to pick up.
            - uses: actions/cache/restore@v6
              with:
                  path: .turbo/cache
                  key: turbo-${{ runner.os }}-lint-${{ github.sha }}
                  restore-keys: |
                      turbo-${{ runner.os }}-lint-
            - run: pnpm install --frozen-lockfile --prefer-offline
            - run: pnpm exec turbo run lint
            - uses: actions/cache/save@v6
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              with:
                  path: .turbo/cache
                  key: turbo-${{ runner.os }}-lint-${{ github.sha }}

    test:
        runs-on: ubuntu-latest
        steps:
            # Started by hand rather than as a service container: transactions need a replica set,
            # and `services` cannot pass `--replSet` through to mongod.
            - name: Start MongoDB replica set
              run: |
                  docker run -d --name mongodb -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
                  until docker exec mongodb mongosh --quiet --eval 'db.runCommand({ ping: 1 })' >/dev/null 2>&1; do sleep 1; done
                  docker exec mongodb mongosh --quiet --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] })'
                  until [ "$(docker exec mongodb mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ]; do sleep 1; done
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - uses: actions/cache/restore@v6
              with:
                  path: .turbo/cache
                  key: turbo-${{ runner.os }}-test-${{ github.sha }}
                  restore-keys: |
                      turbo-${{ runner.os }}-test-
            - run: pnpm install --frozen-lockfile --prefer-offline
            - run: pnpm exec turbo run test
            - uses: actions/cache/save@v6
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              with:
                  path: .turbo/cache
                  key: turbo-${{ runner.os }}-test-${{ github.sha }}

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - uses: actions/cache/restore@v6
              with:
                  path: .turbo/cache
                  key: turbo-${{ runner.os }}-build-${{ github.sha }}
                  restore-keys: |
                      turbo-${{ runner.os }}-build-
            - run: pnpm install --frozen-lockfile --prefer-offline
            - run: pnpm exec turbo run build
            - uses: actions/cache/save@v6
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              with:
                  path: .turbo/cache
                  key: turbo-${{ runner.os }}-build-${{ github.sha }}
