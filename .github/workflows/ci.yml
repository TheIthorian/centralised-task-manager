name: ci

on:
    pull_request:
    push:
        branches: [main]
    # Allows the deploy workflow to gate on a green build.
    workflow_call:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            # Restores turbo's local cache so unchanged packages skip their build.
            # Read-only here; only pushes to main write it, so a pull request can
            # never leave a cache entry behind for later runs to pick up.
            - uses: actions/cache/restore@v6
              with:
                  path: .turbo/cache
                  key: turbo-${{ runner.os }}-lint-${{ github.sha }}
                  restore-keys: |
                      turbo-${{ runner.os }}-lint-
            - run: pnpm install --frozen-lockfile --prefer-offline
            - run: pnpm exec turbo run lint
            - uses: actions/cache/save@v6
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              with:
                  path: .turbo/cache
                  key: turbo-${{ runner.os }}-lint-${{ github.sha }}

    test:
        runs-on: ubuntu-latest
        services:
            mongodb:
                image: mongo:7
                ports:
                    - 27017:27017
                # Mongo is ready in a couple of seconds; the default 10s interval
                # means the job idles waiting for the first probe.
                options: >-
                    --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
                    --health-start-period 2s
                    --health-interval 3s
                    --health-timeout 5s
                    --health-retries 20
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - uses: actions/cache/restore@v6
              with:
                  path: .turbo/cache
                  key: turbo-${{ runner.os }}-test-${{ github.sha }}
                  restore-keys: |
                      turbo-${{ runner.os }}-test-
            - run: pnpm install --frozen-lockfile --prefer-offline
            - run: pnpm exec turbo run test
            - uses: actions/cache/save@v6
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              with:
                  path: .turbo/cache
                  key: turbo-${{ runner.os }}-test-${{ github.sha }}
