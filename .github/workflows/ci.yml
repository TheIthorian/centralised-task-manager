name: ci

on:
    pull_request:
    push:
        branches: [main]
    # Allows the deploy workflow to gate on a green build.
    workflow_call:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            # Restores turbo's local cache so unchanged packages skip their build.
            # Both jobs read the same prefix, so whichever runs first warms the other.
            - uses: actions/cache@v4
              with:
                  path: .turbo/cache
                  key: turbo-${{ runner.os }}-lint-${{ github.sha }}
                  restore-keys: |
                      turbo-${{ runner.os }}-lint-
                      turbo-${{ runner.os }}-
            - run: pnpm install --frozen-lockfile --prefer-offline
            - run: pnpm exec turbo run lint

    test:
        runs-on: ubuntu-latest
        services:
            mongodb:
                image: mongo:7
                ports:
                    - 27017:27017
                # Mongo is ready in a couple of seconds; the default 10s interval
                # means the job idles waiting for the first probe.
                options: >-
                    --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
                    --health-start-period 2s
                    --health-interval 3s
                    --health-timeout 5s
                    --health-retries 20
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - uses: actions/cache@v4
              with:
                  path: .turbo/cache
                  key: turbo-${{ runner.os }}-test-${{ github.sha }}
                  restore-keys: |
                      turbo-${{ runner.os }}-test-
                      turbo-${{ runner.os }}-
            - run: pnpm install --frozen-lockfile --prefer-offline
            - run: pnpm exec turbo run test
