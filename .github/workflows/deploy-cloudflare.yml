name: deploy-cloudflare

on:
    push:
        branches: [main]
        paths:
            - 'apps/web/**'
            - 'apps/landing/**'
            - 'apps/docs/**'
            - 'apps/main/src/**'
            - 'packages/**'
            - '.github/workflows/deploy-cloudflare.yml'
    workflow_dispatch:

concurrency:
    group: deploy-cloudflare
    cancel-in-progress: true

env:
    CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
    # Deployments only proceed if lint and tests are green.
    ci:
        uses: ./.github/workflows/ci.yml

    web:
        needs: ci
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec turbo run build --filter=@ctm/web
            - run: pnpm exec wrangler pages deploy --branch=main
              working-directory: apps/web

    landing:
        needs: ci
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec turbo run build --filter=@ctm/landing
            - run: pnpm exec wrangler pages deploy apps/landing/dist --project-name=ctm-landing --branch=main

    docs:
        needs: ci
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # The spec is generated from apps/main first; the docs build only renders it.
            - run: pnpm exec turbo run generate-openapi --filter=@ctm/main
            - run: pnpm exec turbo run build --filter=@ctm/docs
              env:
                  DOCS_URL: ${{ vars.DOCS_URL }}
            - run: pnpm exec wrangler pages deploy apps/docs/build --project-name=ctm-docs --branch=main
