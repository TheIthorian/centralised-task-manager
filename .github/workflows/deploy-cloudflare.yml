name: deploy-cloudflare

on:
    push:
        branches: [main]
        paths:
            - 'apps/web/**'
            - 'apps/landing/**'
            - 'apps/docs/**'
            - 'apps/main/src/**'
            - 'packages/**'
            - '.github/workflows/deploy-cloudflare.yml'
    workflow_dispatch:

concurrency:
    group: deploy-cloudflare
    cancel-in-progress: true

env:
    CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
    # Deployments only proceed if lint and tests are green.
    ci:
        uses: ./.github/workflows/ci.yml

    # A push that only touches one app should not redeploy the other two.
    changes:
        runs-on: ubuntu-latest
        outputs:
            web: ${{ steps.filter.outputs.web }}
            landing: ${{ steps.filter.outputs.landing }}
            docs: ${{ steps.filter.outputs.docs }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - id: filter
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  BEFORE: ${{ github.event.before }}
              run: |
                  set -euo pipefail

                  # A manual run is an explicit "deploy everything".
                  if [ "$EVENT_NAME" != 'push' ]; then
                      printf 'web=true\nlanding=true\ndocs=true\n' >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  # A force-push or a first push leaves a base commit we cannot diff.
                  if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                      printf 'web=true\nlanding=true\ndocs=true\n' >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  changed=$(git diff --name-only "$BEFORE" HEAD)
                  echo "$changed"

                  shared='^(packages/|pnpm-lock\.yaml|\.github/workflows/(deploy-cloudflare|ci)\.yml)'
                  matches() { echo "$changed" | grep -qE "$1"; }

                  matches "$shared|^apps/web/" && echo 'web=true' >> "$GITHUB_OUTPUT" || echo 'web=false' >> "$GITHUB_OUTPUT"
                  matches "$shared|^apps/landing/" && echo 'landing=true' >> "$GITHUB_OUTPUT" || echo 'landing=false' >> "$GITHUB_OUTPUT"
                  matches "$shared|^apps/docs/|^apps/main/src/" && echo 'docs=true' >> "$GITHUB_OUTPUT" || echo 'docs=false' >> "$GITHUB_OUTPUT"

    web:
        needs: [ci, changes]
        if: needs.changes.outputs.web == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            # Only this app's subtree is needed; the rest of the workspace is dead weight here.
            - run: pnpm install --frozen-lockfile --prefer-offline --filter '@ctm/web...'
            - run: pnpm exec turbo run build --filter=@ctm/web
            - run: pnpm exec wrangler pages deploy --branch=main
              working-directory: apps/web

    landing:
        needs: [ci, changes]
        if: needs.changes.outputs.landing == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile --prefer-offline --filter '@ctm/landing...'
            - run: pnpm exec turbo run build --filter=@ctm/landing
            - run: pnpm exec wrangler pages deploy apps/landing/dist --project-name=ctm-landing --branch=main

    docs:
        needs: [ci, changes]
        if: needs.changes.outputs.docs == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            # The spec is generated from apps/main, so its subtree is needed too.
            - run: pnpm install --frozen-lockfile --prefer-offline --filter '@ctm/docs...' --filter '@ctm/main...'
            - run: pnpm exec turbo run generate-openapi --filter=@ctm/main
            - run: pnpm exec turbo run build --filter=@ctm/docs
              env:
                  DOCS_URL: ${{ vars.DOCS_URL }}
            - run: pnpm exec wrangler pages deploy apps/docs/build --project-name=ctm-docs --branch=main
