name: deploy-cloudflare

on:
    push:
        branches: [main]
        paths:
            - 'apps/web/**'
            - 'apps/landing/**'
            - 'apps/docs/**'
            - 'apps/main/src/**'
            - 'packages/**'
            - '.github/workflows/deploy-cloudflare.yml'
    workflow_dispatch:

concurrency:
    group: deploy-cloudflare
    cancel-in-progress: true

env:
    CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
    # Deployments only proceed if lint and tests are green.
    ci:
        uses: ./.github/workflows/ci.yml

    # A push that only touches one app should not redeploy the other two.
    # `turbo ls --affected` walks the workspace graph, so a change to packages/ui
    # marks @ctm/web affected without anyone maintaining a path list by hand.
    changes:
        runs-on: ubuntu-latest
        outputs:
            affected: ${{ steps.affected.outputs.packages }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            # Only the root package, which is where turbo itself lives.
            - run: pnpm install --frozen-lockfile --prefer-offline --filter ctm
            - id: affected
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  BEFORE: ${{ github.event.before }}
              run: |
                  set -euo pipefail

                  # A manual run, or a base commit we cannot diff against (force-push,
                  # first push), tells us nothing — deploy everything.
                  if [ "$EVENT_NAME" != 'push' ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                      echo 'packages=["*"]' >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  # Workflow changes belong to no package, so turbo cannot see them.
                  if git diff --name-only "$BEFORE" HEAD | grep -q '^\.github/workflows/'; then
                      echo 'packages=["*"]' >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  packages=$(TURBO_SCM_BASE="$BEFORE" pnpm exec turbo ls --affected --output=json |
                      jq -c '[.packages.items[].name]')

                  echo "affected: $packages"
                  echo "packages=$packages" >> "$GITHUB_OUTPUT"

    web:
        needs: [ci, changes]
        if: contains(fromJSON(needs.changes.outputs.affected), '*') || contains(fromJSON(needs.changes.outputs.affected), '@ctm/web')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            # Only this app's subtree is needed; the rest of the workspace is dead weight here.
            - run: pnpm install --frozen-lockfile --prefer-offline --filter '@ctm/web...'
            - run: pnpm exec turbo run build --filter=@ctm/web
            - run: pnpm exec wrangler pages deploy --branch=main
              working-directory: apps/web

    landing:
        needs: [ci, changes]
        if: contains(fromJSON(needs.changes.outputs.affected), '*') || contains(fromJSON(needs.changes.outputs.affected), '@ctm/landing')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile --prefer-offline --filter '@ctm/landing...'
            - run: pnpm exec turbo run build --filter=@ctm/landing
            - run: pnpm exec wrangler pages deploy apps/landing/dist --project-name=ctm-landing --branch=main

    docs:
        needs: [ci, changes]
        if: >-
            contains(fromJSON(needs.changes.outputs.affected), '*')
            || contains(fromJSON(needs.changes.outputs.affected), '@ctm/docs')
            || contains(fromJSON(needs.changes.outputs.affected), '@ctm/main')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            # The spec is generated from apps/main, so its subtree is needed too.
            - run: pnpm install --frozen-lockfile --prefer-offline --filter '@ctm/docs...' --filter '@ctm/main...'
            - run: pnpm exec turbo run generate-openapi --filter=@ctm/main
            - run: pnpm exec turbo run build --filter=@ctm/docs
              env:
                  DOCS_URL: ${{ vars.DOCS_URL }}
            - run: pnpm exec wrangler pages deploy apps/docs/build --project-name=ctm-docs --branch=main
